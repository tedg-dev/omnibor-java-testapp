# OmniBOR Sidecar — Phase-Isolated SPDX Generation
#
# Phase-isolated CI/CD pipeline:
#   Job 1 (build-and-phase1): Build on Amazon Linux 2023 + Phase 1 sidecar
#   Job 2 (phase2-analyze):   Phase 2 SPDX generation in a SEPARATE runner
#
# The two jobs communicate ONLY via GitHub Actions artifact upload/download.
# No shared filesystem — proves the enterprise deployment model where
# Phase 1 runs at the customer build site and Phase 2 runs in a separate
# analysis service (e.g., Corona).
#
# Toggle: set repository variable OMNIBOR_ENABLED=false to disable sidecar
#         jobs, or use workflow_dispatch to choose per-run.

name: Build & SPDX

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.drawio"
      - "output/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_sbom:
        description: "Generate SPDX SBOM via OmniBOR sidecar"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  SIDECAR_IMAGE: ghcr.io/tedg-dev/omnibor-sidecar:latest
  MVN_VER: "3.9.8"

jobs:
  # ── Baseline: build only, no sidecar (timing reference) ──
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build on Amazon Linux 2023 (baseline)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e MVN_VER="${{ env.MVN_VER }}" \
            amazoncorretto:21-al2023 \
            bash -c '
              dnf install -y tar gzip &&
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MVN_VER}/binaries/apache-maven-${MVN_VER}-bin.tar.gz" -o /tmp/mvn.tar.gz &&
              tar xzf /tmp/mvn.tar.gz -C /opt &&
              export PATH="/opt/apache-maven-${MVN_VER}/bin:$PATH" &&
              mvn --version &&
              mvn package -q
            '

  # ── Phase 1: Build + sidecar build interception ──
  # Produces: manifest, treedb, dep:tree, build artifacts
  build-and-phase1:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.enable_sbom) ||
      (github.event_name != 'workflow_dispatch' && vars.OMNIBOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build on Amazon Linux 2023
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e MVN_VER="${{ env.MVN_VER }}" \
            amazoncorretto:21-al2023 \
            bash -c '
              dnf install -y tar gzip &&
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MVN_VER}/binaries/apache-maven-${MVN_VER}-bin.tar.gz" -o /tmp/mvn.tar.gz &&
              tar xzf /tmp/mvn.tar.gz -C /opt &&
              export PATH="/opt/apache-maven-${MVN_VER}/bin:$PATH" &&
              mvn --version &&
              mvn package -q
            '

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull sidecar image
        run: docker pull "$SIDECAR_IMAGE"

      # Phase 1: build interception only (treedb + dep:tree + manifest)
      - name: "Phase 1: Build interception via sidecar"
        run: |
          mkdir -p "${{ github.workspace }}/spdx-output"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace/repos/omnibor-java-testapp" \
            -v "${{ github.workspace }}/spdx-output:/workspace/output" \
            -e OMNIBOR_MODE=sidecar \
            "$SIDECAR_IMAGE" \
            python3 /workspace/app/analyze.py \
              --repo omnibor-java-testapp \
              --mode sidecar \
              --phase build \
              --skip-clone

      # Upload Phase 1 artifacts for Job 2
      - name: Upload Phase 1 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phase1-artifacts
          path: spdx-output/
          retention-days: 7

      # Upload build output (JARs) for Job 2
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-output
          path: target/
          retention-days: 7

  # ── Phase 2: SPDX generation (SEPARATE runner, no shared FS) ──
  # Downloads Phase 1 artifacts + build output, runs SPDX generation
  # in a fresh sidecar container. Proves true phase isolation.
  phase2-analyze:
    needs: build-and-phase1
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.enable_sbom) ||
      (github.event_name != 'workflow_dispatch' && vars.OMNIBOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for pom.xml structure)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Download Phase 1 output (manifest, treedb, dep:tree)
      - name: Download Phase 1 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: phase1-artifacts
          path: spdx-output/

      # Download build output (JARs) into target/
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-output
          path: target/

      # Verify we received Phase 1 artifacts
      - name: Verify Phase 1 artifacts
        run: |
          echo "=== Phase 1 artifacts ==="
          find spdx-output/ -type f | head -n 20
          echo ""
          echo "=== Build output ==="
          find target/ -name "*.jar" -type f
          echo ""
          MANIFEST=$(find spdx-output/ -name "phase1_manifest.json" -type f | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "[ERROR] No phase1_manifest.json found"
            exit 1
          fi
          echo "[OK] Manifest: $MANIFEST"

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull sidecar image
        run: docker pull "$SIDECAR_IMAGE"

      # Find manifest path and run Phase 2
      - name: "Phase 2: SPDX generation via sidecar"
        run: |
          MANIFEST=$(find spdx-output/ -name "phase1_manifest.json" -type f | head -n 1)
          # Map host manifest path to container path
          # Host: spdx-output/omnibor/java/<repo>/<ts>/phase1_manifest.json
          # Container: /workspace/output/omnibor/java/<repo>/<ts>/phase1_manifest.json
          CONTAINER_MANIFEST="/workspace/output/${MANIFEST#spdx-output/}"

          echo "[INFO] Host manifest: $MANIFEST"
          echo "[INFO] Container manifest: $CONTAINER_MANIFEST"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace/repos/omnibor-java-testapp" \
            -v "${{ github.workspace }}/spdx-output:/workspace/output" \
            -e OMNIBOR_MODE=sidecar \
            "$SIDECAR_IMAGE" \
            python3 /workspace/app/analyze.py \
              --repo omnibor-java-testapp \
              --mode sidecar \
              --phase spdx \
              --manifest "$CONTAINER_MANIFEST" \
              --skip-clone

      # Upload final SPDX output
      - name: Upload SPDX output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: spdx-output
          path: spdx-output/
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Phase-Isolated SPDX Output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Phase 1 (build interception) and Phase 2 (SPDX generation)" >> "$GITHUB_STEP_SUMMARY"
          echo "ran in **separate GitHub Actions jobs** (different runners)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SPDX Files" >> "$GITHUB_STEP_SUMMARY"
          find "${{ github.workspace }}/spdx-output" \
            -name "*.spdx.json" -type f | sort | \
            while read -r f; do
              echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            done
